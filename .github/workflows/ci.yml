name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m pytest -q
      - name: Demonstração com dados sintéticos
        run: |
          python main.py exemplo --saida /tmp/exemplo.pdf --registros 200
          python main.py executar --pdf /tmp/exemplo.pdf --saida /tmp/resultados --validar --estrito
